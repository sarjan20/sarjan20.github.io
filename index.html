<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Hub</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font and smooth transitions */
        :root {
            font-family: 'Inter', sans-serif;
        }
        .game-card {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .button-press {
            animation: press 0.1s ease-out;
        }
        @keyframes press {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-indigo-700 tracking-tight mb-2">
                🎮 The Mini-Game Arcade
            </h1>
            <p class="text-xl text-gray-500">Three quick games in one compact file.</p>
        </header>

        <!-- Games Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- GAME 1: Rock Paper Scissors -->
            <div id="rps-game" class="game-card bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500">
                <h2 class="text-3xl font-bold mb-4 text-gray-800">Rock Paper Scissors</h2>
                <p class="mb-4 text-sm text-gray-600">Beat the computer in a classic duel.</p>

                <div class="flex justify-between space-x-3 mb-6">
                    <button onclick="playRPS('rock', this)" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md w-full">
                        ✊ Rock
                    </button>
                    <button onclick="playRPS('paper', this)" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md w-full">
                        🖐️ Paper
                    </button>
                    <button onclick="playRPS('scissors', this)" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md w-full">
                        ✌️ Scissors
                    </button>
                </div>

                <div id="rps-result" class="p-4 rounded-lg bg-indigo-100 text-indigo-800 font-medium text-center">
                    Make your move!
                </div>
            </div>

            <!-- GAME 2: Number Guessing Game -->
            <div id="guess-game" class="game-card bg-white p-6 rounded-xl shadow-lg border-t-4 border-teal-500">
                <h2 class="text-3xl font-bold mb-4 text-gray-800">Guess The Number</h2>
                <p class="mb-4 text-sm text-gray-600">Guess a number between 1 and 10.</p>

                <input type="number" id="guess-input" min="1" max="10" placeholder="Enter your guess (1-10)"
                       class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">

                <button onclick="checkGuess(this)"
                        class="w-full bg-teal-500 hover:bg-teal-600 text-white font-semibold py-3 rounded-lg shadow-md transition duration-150 ease-in-out">
                    Check Guess
                </button>

                <div id="guess-result" class="mt-4 p-4 rounded-lg bg-teal-100 text-teal-800 font-medium text-center">
                    Game started!
                </div>
            </div>

            <!-- GAME 3: Click Speed Challenge -->
            <div id="click-game" class="game-card bg-white p-6 rounded-xl shadow-lg border-t-4 border-red-500">
                <h2 class="text-3xl font-bold mb-4 text-gray-800">Click Speed Test</h2>
                <p class="mb-4 text-sm text-gray-600">Click the button as fast as you can!</p>

                <div class="text-center mb-6">
                    <span class="text-5xl font-extrabold text-red-600" id="click-count">0</span>
                    <span class="block text-gray-500">clicks</span>
                </div>

                <button onclick="incrementClick(this)"
                        class="w-full bg-red-500 hover:bg-red-600 text-white font-extrabold py-5 rounded-lg shadow-xl mb-4 text-2xl transition duration-150 ease-in-out">
                    CLICK ME!
                </button>

                <button onclick="resetClick(this)"
                        class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-lg transition duration-150 ease-in-out">
                    Reset Counter
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // --- Game 1: Rock Paper Scissors Logic ---
        function playRPS(userChoice, button) {
            // Add visual press effect
            button.classList.add('button-press');
            setTimeout(() => button.classList.remove('button-press'), 150);

            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];
            let result;

            if (userChoice === computerChoice) {
                result = "It's a draw! 🤝";
            } else if (
                (userChoice === 'rock' && computerChoice === 'scissors') ||
                (userChoice === 'paper' && computerChoice === 'rock') ||
                (userChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = `You Win! 🎉 Computer chose ${getEmoji(computerChoice)}.`;
            } else {
                result = `You Lose. 😔 Computer chose ${getEmoji(computerChoice)}.`;
            }

            document.getElementById('rps-result').innerHTML = `
                You chose ${getEmoji(userChoice)}. ${result}
            `;
        }

        function getEmoji(choice) {
            switch (choice) {
                case 'rock': return '✊';
                case 'paper': return '🖐️';
                case 'scissors': return '✌️';
                default: return '';
            }
        }


        // --- Game 2: Number Guessing Game Logic ---
        let targetNumber = Math.floor(Math.random() * 10) + 1;
        const guessResultEl = document.getElementById('guess-result');

        function checkGuess(button) {
            // Add visual press effect
            button.classList.add('button-press');
            setTimeout(() => button.classList.remove('button-press'), 150);

            const inputEl = document.getElementById('guess-input');
            const guess = parseInt(inputEl.value);

            if (isNaN(guess) || guess < 1 || guess > 10) {
                guessResultEl.className = 'mt-4 p-4 rounded-lg bg-red-100 text-red-800 font-medium text-center';
                guessResultEl.textContent = 'Please enter a valid number between 1 and 10.';
                return;
            }

            if (guess === targetNumber) {
                guessResultEl.className = 'mt-4 p-4 rounded-lg bg-green-100 text-green-800 font-medium text-center';
                guessResultEl.textContent = `You got it! The number was ${targetNumber}! Starting a new game...`;
                // Reset game
                targetNumber = Math.floor(Math.random() * 10) + 1;
                inputEl.value = '';
            } else if (guess < targetNumber) {
                guessResultEl.className = 'mt-4 p-4 rounded-lg bg-yellow-100 text-yellow-800 font-medium text-center';
                guessResultEl.textContent = 'Too low. Try again!';
            } else {
                guessResultEl.className = 'mt-4 p-4 rounded-lg bg-yellow-100 text-yellow-800 font-medium text-center';
                guessResultEl.textContent = 'Too high. Try again!';
            }
        }

        // --- Game 3: Click Speed Challenge Logic ---
        let clickCount = 0;
        const clickCountEl = document.getElementById('click-count');

        function incrementClick(button) {
            // Add visual press effect
            button.classList.add('button-press');
            setTimeout(() => button.classList.remove('button-press'), 150);

            clickCount++;
            clickCountEl.textContent = clickCount;
        }

        function resetClick(button) {
            // Add visual press effect
            button.classList.add('button-press');
            setTimeout(() => button.classList.remove('button-press'), 150);

            clickCount = 0;
            clickCountEl.textContent = clickCount;
        }

        // Ensure all games are ready on load
        window.onload = function() {
            // Initial message setup (just in case)
            document.getElementById('rps-result').textContent = 'Make your move!';
            document.getElementById('guess-result').textContent = 'Game started!';
            document.getElementById('click-count').textContent = '0';
        };

    </script>
</body>
</html>
