    <!-- API Utility Script -->
    <script>
        // API Configuration (used for the course content feature)
        const apiKey = ""; // Leave as-is, Canvas will provide it at runtime
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        /**
         * Fetches grounded content from the Gemini API using exponential backoff.
         * @param {string} prompt The query to send to the LLM.
         * @param {string} systemInstruction The system instruction for the LLM's persona.
         * @returns {Promise<{text: string, sources: Array<{uri: string, title: string}>}>}
         */
        async function fetchGroundedContent(prompt, systemInstruction) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: [{ "google_search": {} }],
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
            };

            const maxRetries = 5;
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429 && attempt < maxRetries - 1) {
                        // Rate limit error, wait and retry
                        const delay = Math.pow(2, attempt) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    }

                    if (!response.ok) {
                        throw new Error(`API call failed with status: ${response.status}`);
                    }

                    const result = await response.json();
                    const candidate = result.candidates?.[0];

                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        const text = candidate.content.parts[0].text;
                        let sources = [];
                        const groundingMetadata = candidate.groundingMetadata;

                        if (groundingMetadata && groundingMetadata.groundingAttributions) {
                            sources = groundingMetadata.groundingAttributions
                                .map(attribution => ({
                                    uri: attribution.web?.uri,
                                    title: attribution.web?.title,
                                }))
                                .filter(source => source.uri && source.title);
                        }

                        return { text, sources };
                    } else {
                        // Throw an error if the model response is malformed or empty
                        throw new Error("Model response was empty or malformed.");
                    }

                } catch (error) {
                    console.error(`Attempt ${attempt + 1} failed:`, error);
                    if (attempt === maxRetries - 1) {
                        return { text: "Failed to load content after several retries. Please check your network connection or try a different topic.", sources: [] };
                    }
                    const delay = Math.pow(2, attempt) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }
    </script>

        function slugify(str) {

        /** Renders the Course Details View */
        async function renderCourseView() {

            } else {
                // Fetch content using LLM (with search grounding)
                const systemPrompt = "You are a specialized AI tutor for Bachelor of Computer Applications (BCA) students. Provide a detailed, easy-to-understand explanation based on the user's query. Format the response using Markdown.";

                // Cache and display
                appState.courseContentCache[courseId] = result;
                displayContent(result.text, result.sources);
            }

        /** Helper to display fetched content and sources */
        function displayContent(text, sources) {
            const contentContainer = document.getElementById('content-container');
            if (contentContainer) {
                // Simple Markdown to HTML conversion (basic paragraphs and lists)
                let htmlContent = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/^- (.*)/gm, '<li>$1</li>') // List items (simple)
                    .replace(/[\r\n]{2,}/g, '</p><p>') // Paragraphs
                    .replace(/[\r\n]/g, '<br>') // Line breaks
                    .trim();

                if (!htmlContent.startsWith('<p>')) {
                    htmlContent = `<p>${htmlContent}`;
                }
                if (!htmlContent.endsWith('</p>')) {
                    htmlContent = `${htmlContent}</p>`;
                }

                contentContainer.innerHTML = `<div class="prose max-w-none text-indigo-200">${htmlContent}</div>`;
            }

            const sourcesContainer = document.getElementById('sources-container');
            if (sourcesContainer && sources.length > 0) {
                sourcesContainer.innerHTML = `
                    <p class="font-bold text-sm text-purple-400 mt-4">Grounding Sources:</p>
                    <ul class="list-disc list-inside space-y-1">
                        ${sources.map(s => `<li><a href="${s.uri}" target="_blank" class="text-indigo-400 hover:text-purple-300 transition duration-150">${s.title}</a></li>`).join('')}
                    </ul>
                `;
            }
        }
